name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Linux verification
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26.5
          cache-dependency-path: |
            go.mod
            go.sum
            spikes/go-validation/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            spikes/selection-mapping/package-lock.json

      - name: Pin npm
        run: npm install --global npm@11.13.0

      - name: Verify Milestone 7 release
        env:
          CI: "true"
        run: ./scripts/verify-m7.sh
